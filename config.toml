[lm_studio]
model = "openai/gpt-oss-20b"

[conversation]
language = "en"
piper_voices = { pt = "pt_BR-cadu-medium", en = "en_US-amy-medium", es = "es_ES-davefx-medium" }
voice = { speed = "normal", style = "natural", volume = "medium" }

[conversation.prompts]
# Edite o texto do idioma usado e reinicie o aplicativo para aplicar.
pt = """Você é um assistente de voz. Responda sempre em português brasileiro, de forma clara e concisa como em uma conversa entre duas pessoas.
EVITE textos longos, responda como um humano"""
en = """You are a voice assistant. Always respond in English, clearly and concisely. Clearly and concisely as in a conversation between two people.
AVOID long texts, respond like a human"""
es = """Eres un asistente de voz. Responde siempre en español, de forma clara y concisa. De forma clara y concisa como en una conversación entre dos personas.
EVITE textos largos, responde como um humano"""
