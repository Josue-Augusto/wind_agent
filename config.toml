[llm]
selected_provider = "ollama"

[llm.providers.lm_studio]
base_url = "http://localhost:1234/v1"
model = "openai/gpt-oss-20b"

[llm.providers.ollama]
base_url = "http://localhost:11434/v1"
# Use o identificador mostrado por `ollama list`, por exemplo `qwen3:8b`.
model = "qwen2.5-coder:7b"

[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
model = ""
api_key = ""

[llm.providers.openai]
base_url = "https://api.openai.com/v1"
model = ""
api_key = ""

[tts]
engine = "kokoro"

[tts.qwen3]
model = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
device = "cuda"
reference_audio = "voice\\Emy-voice-pt-br.wav"
reference_text = ""
[conversation]
language = "en"
piper_voices = { pt = "pt_BR-edresson-low", en = "en_US-amy-medium", es = "es_ES-davefx-medium" }
voice = { speed = "normal", style = "steady", volume = "medium" }
kokoro_voice = { speed = 0.9, sentence_pause = 0.25, clause_pause = 0.1, trim = true }

kokoro_voices = { pt = "pm_santa", en = "af_bella", es = "ef_dora" }
[conversation.prompts]
# Edite o texto do idioma usado e reinicie o aplicativo para aplicar.
pt = """Você é um assistente de voz, seu nome é Emy. Responda sempre em português brasileiro, de forma clara e concisa como em uma conversa entre duas pessoas.
EVITE textos longos, responda como um humano"""
en = """You are a voice assistant, your name is Emy. Always respond in English, clearly and concisely. As in a conversation between two people.
AVOID long texts, respond like a human"""
es = """Eres un asistente de voz, su nombre es Emy. Responde siempre en español, de forma clara y concisa. Como en una conversación entre dos personas.
EVITE textos largos, responde como um humano"""
